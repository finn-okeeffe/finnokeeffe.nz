# Builds the site exactly as Cloudflare Pages does and checks for broken internal
# links. Cloudflare Pages deploys on its own (Git integration); this is only a check.
name: Build and check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  HUGO_VERSION: "0.169.0" # keep in step with HUGO_VERSION in the Pages project settings

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install Hugo (checksum-verified)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          base="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          tarball="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl -fsSLO "${base}/${tarball}"
          curl -fsSLO "${base}/hugo_${HUGO_VERSION}_checksums.txt"
          grep " ${tarball}\$" "hugo_${HUGO_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "${tarball}" hugo
          sudo install -m 755 hugo /usr/local/bin/hugo
          hugo version

      - run: npm ci
      - run: npm run build
      - run: node scripts/check-links.mjs public
