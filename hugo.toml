baseURL = "https://www.finnokeeffe.nz/"
title = "Finn O'Keeffe"
locale = "en"
timeZone = "Pacific/Auckland"
enableRobotsTXT = true
# No tags or categories (Ghost had none).
disableKinds = ["taxonomy", "term"]

[pagination]
  pagerSize = 6 # Solo's posts_per_page
  disableAliases = true # /page/1/ is a redirect in static/_redirects

# Ghost URLs: every post and page lives at /<slug>/.
[permalinks.page]
  posts = "/:slug/"
  pages = "/:slug/"

[outputs]
  home = ["html", "rss", "sitemap"]
  section = ["html"]
  page = ["html"]

# Ghost served its feed at /rss/; Hugo writes /rss/index.xml and
# static/_redirects maps /rss/ onto it.
[outputFormats.rss]
  path = "rss"

[params]
  description = "Statistics, data, python, and art."
  primaryHeader = "Finn O'Keeffe"
  logo = "content/images/2026/03/Logo-2-1.webp"
  icon = "content/images/2026/03/Icon.png"
  cover = "content/images/2026/03/cherry-blossom.jpg"
  # Solo theme settings carried over from Ghost.
  backgroundColor = "#282828"
  accentColor = "#98971a"
  headingFont = "Chakra Petch"
  [params.author]
    name = "Finn O'Keeffe"
    image = "content/images/author/finn.jpg"
    url = "/about/"

[[menus.main]]
  name = "Home"
  url = "/"
  weight = 1
[[menus.main]]
  name = "About"
  pageRef = "/pages/about"
  weight = 2
[[menus.main]]
  name = "Other work"
  pageRef = "/pages/other-work"
  weight = 3

[[menus.footer]]
  name = "GitHub"
  url = "https://github.com/finn-okeeffe"
  weight = 1
[[menus.footer]]
  name = "LinkedIn"
  url = "https://www.linkedin.com/in/finn-okeeffe/"
  weight = 2

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      # Raw HTML in posts (Ghost HTML cards) is allowed.
      unsafe = true
    [markup.goldmark.parser]
      # Lets the image render hook emit <figure> for images on their own line.
      wrapStandAloneImageWithinParagraph = false
      [markup.goldmark.parser.attribute]
        block = true
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.typographer]
        # Keep quotes and dashes exactly as written.
        disable = true
      [markup.goldmark.extensions.passthrough]
        # Math: \( inline \), \[ display \] or $$ display $$, rendered at build time.
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['\[', '\]'], ['$$', '$$']]
          inline = [['\(', '\)']]

[sitemap]
  changeFreq = ""
  priority = -1
